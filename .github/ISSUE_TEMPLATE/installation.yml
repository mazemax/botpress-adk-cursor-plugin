{
  "name": "Installation problem",
  "description": "Report a reproducible source/local/marketplace installation issue",
  "title": "[Wave 1]: ",
  "labels": [],
  "body": [
    {
      "type": "markdown",
      "attributes": {
        "value": "Do not include tokens, private code, customer data, real workspace IDs, or sensitive transcripts. Security reports follow SECURITY.md."
      }
    },
    {
      "type": "textarea",
      "id": "package-version",
      "attributes": {
        "label": "Package version",
        "description": "For example, 1.0.0-rc.1"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "host-and-version",
      "attributes": {
        "label": "Host and version",
        "description": "Include VS Code/Copilot, Codex, or Cursor surface and exact version"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "os-and-architecture",
      "attributes": {
        "label": "OS and architecture",
        "description": "For example, Windows 11 x64"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "install-source-and-revision",
      "attributes": {
        "label": "Install source and revision",
        "description": "Repository, path/marketplace, tag or full commit SHA"
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "textarea",
      "id": "expected-and-actual",
      "attributes": {
        "label": "Expected and actual result",
        "description": "Describe what you expected, what happened, and any relevant logs after redaction."
      },
      "validations": {
        "required": true
      }
    },
    {
      "type": "checkboxes",
      "id": "evidence-check",
      "attributes": {
        "label": "Evidence check",
        "options": [
          {
            "label": "I searched existing issues and removed sensitive information.",
            "required": true
          }
        ]
      }
    }
  ]
}
